[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vnle-prototype"
version = "0.1.0"
description = "Visual text discovery outside user-selected subtitle regions"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
analysis = ["av==19.0.1", "numpy>=2,<3", "opencv-python-headless>=4.13,<5", "rapidocr==3.10.0"]
cuda = ["onnxruntime-gpu[cuda,cudnn]==1.23.2", "nvidia-cublas-cu12>=12,<13"]
test = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
vnle = "vnle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vnle = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
