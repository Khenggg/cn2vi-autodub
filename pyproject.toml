[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cn2vi-autodub"
version = "0.1.0"
description = "CN2VI AutoDub core and benchmark foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "numpy==1.26.4", "pillow==11.3.0", "opencv-python==4.11.0.86", "uv==0.9.6"]

[project.scripts]
autodub-benchmark = "autodub.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
