name: core-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -q && ruff check src tests benchmarks
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker build -t cn2vi-autodub:ci .
      - run: |
          docker run -d --name cn2vi-core -p 8080:8080 cn2vi-autodub:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs cn2vi-core
          exit 1
